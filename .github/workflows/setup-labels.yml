# Создаёт и обновляет метки репозитория. Запуск: Actions → «Настроить метки» → Run workflow.
# Запускать повторно безопасно: существующие метки обновятся, новые создадутся.
# Цвета — один оттенок на группу, чем насыщеннее, тем важнее или дальше по пути.
#
# Названия меток цели и рынка используются в idea-labels.yml, стадии — в ISSUE_TEMPLATE/idea.yml.
# Переименовываешь здесь — переименуй и там.

name: Настроить метки

on:
  workflow_dispatch:
    inputs:
      remove_unknown:
        description: Удалить метки, которых нет в списке (стандартные bug, accessibility и другие). Они снимутся со всех issues
        type: boolean
        default: false

permissions:
  issues: write

jobs:
  labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        env:
          REMOVE_UNKNOWN: ${{ inputs.remove_unknown }}
        with:
          script: |
            const labels = [
              // Стадия — одна. Фиолетовые, темнее к разработке
              ['стадия: идея', 'd8b9ff', 'Есть описание. Это и есть бэклог'],
              ['стадия: проверка', 'a371f7', 'Кто-то проверяет спрос: ресёрч, интервью, лендинг, реклама'],
              ['стадия: разработка', '6639ba', 'Есть репозиторий proj-*, пишут код'],
              // Цель — одна. Зелёные
              ['цель: заработать', '1a7f37', 'Продукт ради денег'],
              ['цель: польза', '4ac26b', 'Для города, сообщества, open source без расчёта на доход'],
              ['цель: эксперимент', 'aceebb', 'Научиться, попробовать технологию'],
              // Рынок — один. Синие
              ['рынок: Батуми', '0550ae', 'Экспаты, туристы, местный бизнес, город'],
              ['рынок: вайб-клуб', '218bff', 'Инструменты для участников и клуба'],
              ['рынок: любой', '80ccff', 'Продукт не привязан к месту'],
              ['рынок: другое место', 'cae8ff', 'Другой город или страна'],
              // Команда — флаги, можно несколько сразу. Красно-оранжевые, ярче — срочнее
              ['нужен владелец', 'cf222e', 'Вести идею некому — возьми её'],
              ['нужны люди', 'fb8f44', 'Ищем, кто присоединится к команде'],
              ['команда укомплектована', 'ffd8b5', 'Люди сейчас не нужны'],
            ];

            for (const [name, color, description] of labels) {
              try {
                await github.rest.issues.updateLabel({ ...context.repo, name, color, description });
                core.info(`обновлена: ${name}`);
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ ...context.repo, name, color, description });
                core.info(`создана: ${name}`);
              }
            }

            if (process.env.REMOVE_UNKNOWN === 'true') {
              const known = new Set(labels.map(([name]) => name));
              const existing = await github.paginate(github.rest.issues.listLabelsForRepo, {
                ...context.repo,
                per_page: 100,
              });
              for (const { name } of existing) {
                if (known.has(name)) continue;
                await github.rest.issues.deleteLabel({ ...context.repo, name });
                core.info(`удалена: ${name}`);
              }
            }
