name: 💡 Новая идея
description: Предложить идею проекта для клуба
labels: ["стадия: идея"]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо, что делишься! Название — в заголовок выше, остальное — парой предложений. Детали можно добавить потом.

  - type: textarea
    id: idea
    attributes:
      label: В чём идея
      placeholder: Каталог мастеров с отзывами и бот для заявок
    validations:
      required: true

  - type: input
    id: audience
    attributes:
      label: Для кого
      placeholder: Экспаты, которым нужен мастер
    validations:
      required: true

  - type: input
    id: problem
    attributes:
      label: Какую проблему решает
      placeholder: Сложно быстро найти проверенного мастера

  # Ответы на три вопроса ниже превращаются в метки — .github/workflows/idea-labels.yml.
  # Workflow ищет в ответе ключевое слово: Заработать, Польза, Эксперимент, Батуми, Вайб-клуб,
  # Любой, Другое место, Готов вести. Меняешь варианты — сохрани эти слова или поправь workflow.
  - type: dropdown
    id: goal
    attributes:
      label: Цель
      options:
        - 💰 Заработать — продукт ради денег
        - 🤝 Польза — для города и сообщества
        - 🧪 Эксперимент — научиться, попробовать новое
    validations:
      required: true

  - type: dropdown
    id: market
    attributes:
      label: Рынок
      options:
        - 🏙 Батуми
        - 🧑‍💻 Вайб-клуб — для участников и клуба
        - 🌍 Любой — без привязки к месту
        - 📍 Другое место — другой город или страна
    validations:
      required: true

  - type: dropdown
    id: role
    attributes:
      label: Твоё участие
      options:
        - 🙋 Готов вести проект
        - 🤝 Готов участвовать
        - 💡 Только предлагаю идею
    validations:
      required: true

  - type: input
    id: money
    attributes:
      label: Кто будет платить
      placeholder: Мастера — за размещение

  - type: input
    id: team
    attributes:
      label: Кто уже в команде
      placeholder: Пока никого

  - type: input
    id: help
    attributes:
      label: Какая помощь нужна
      placeholder: Бэкенд, контакты с мастерами

  - type: textarea
    id: links
    attributes:
      label: Ссылки и материалы
      description: Конкуренты, исследования, обсуждения. Файлы можно перетащить сюда
